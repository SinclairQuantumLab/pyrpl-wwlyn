[project]
name = "pyrpl"
version = "0.9.5.0"
description = "DSP servo controller for quantum optics with the RedPitaya"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Leonhard Neuhaus", email = "neuhaus@lkb.upmc.fr" },
]
keywords = [
    "Red Pitaya",
    "DSP",
    "FPGA",
    "IIR",
    "PDH",
    "synchronous detection",
    "filter",
    "PID",
    "control",
    "lockbox",
    "servo",
    "feedback",
    "lock",
    "quantum optics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "scp>=0.15,<1",
    "matplotlib>=3.10.5,<4",
    "scipy>=1.16.1,<2",
    "pyyaml>=6,<7",
    "pandas>=2.3.3,<4",
    "pyqtgraph>=0.14,<1",
    "numpy>=2.3.2,<3",
    "paramiko>=4,<6",
    "pyqt5>=5.15.11,<6",
    "qtpy>=2.4.3,<3",
    "nbconvert>=7.16,<8",
    "jupyter-client>=8.6,<9",
    "netifaces2>=0.0.22,<1",
    "lmfit>=1.3.4,<2",
    "qasync>=0.28,<0.29",
    "six>=1.17,<2",
]

[project.optional-dependencies]
test = [
    "coverage>=7.10,<8",
    "ipykernel>=6.31,<8",
    "nose-ng>=1.4.3,<2",
]

[project.scripts]
pyrpl = "pyrpl.__main__:main"

[project.urls]
Homepage = "http://lneuhaus.github.io/pyrpl/"
Documentation = "https://pyrpl.readthedocs.io/"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.build-backend]
module-name = "pyrpl"
module-root = ""
source-include = [
    "Documentation.md",
    "Makefile",
    "pyrpl.spec",
    "pyrpl.yml",
    "setup.cfg",
    "test.ipynb.template",
    "tests/**",
]
wheel-exclude = [
    "pyrpl/fpga/targets/**",
    "pyrpl/fpga/sim/**",
    "pyrpl/fpga/ip/**",
    "pyrpl/fpga/out/**",
    "pyrpl/fpga/rtl/**",
    "pyrpl/fpga/sdc/**",
    "pyrpl/test/durations.txt",
    "pyrpl/test/test_ipython_notebook/test_notebook.ipynb",
]
