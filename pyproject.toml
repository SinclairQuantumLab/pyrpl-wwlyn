[project]
name = "sinclair-pyrpl-wwlyn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sinclair Lab", email = "sinclairquantumlab@gmail.com" }
]
requires-python = "==3.9.*"
dependencies = [
    "scp",
    "matplotlib",
    # Keep the deprecated scipy.misc.derivative API used by the lockbox code.
    "scipy>=1.9,<1.12",
    "pyyaml",
    "pandas",
    "pyqtgraph",
    # PyRPL still uses the legacy np.float/np.int/np.complex aliases.
    "numpy>=1.23,<1.24",
    "paramiko>=2.0",
    "nose>=1.0",
    "pyqt5",
    "qtpy",
    "nbconvert",
    "jupyter-client",
    # Drop-in fork with Windows CPython 3.9 wheels.
    "netifaces2>=0.0.22",
    # lmfit 1.3.3+ requires NumPy 1.24+, which conflicts with PyRPL's aliases.
    "lmfit>=1.0.1,<1.3.3",
    "quamash",
    "ipykernel>=6.31.0",
]

[project.scripts]
sinclair-pyrpl-wwlyn = "pyrpl.__main__:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.build-backend]
module-name = "pyrpl"
module-root = ""
